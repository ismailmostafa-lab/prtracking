<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enterprise Project Management — PR System</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1fb;--card:#fff;--btn-start:#A666B0;--btn-end:#573B92;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Cairo',sans-serif;}
.header-box{max-width:1300px;margin:26px auto 0;background:linear-gradient(135deg,var(--btn-start),var(--btn-end));padding:26px;border-radius:22px;text-align:center;color:#fff;}
.header-title{font-size:24px;font-weight:700;-webkit-animation:fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) both;animation:fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) both;}
.header-sub{font-size:15px;opacity:.9;-webkit-animation:fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;animation:fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;}
@-webkit-keyframes fadeDown{from{opacity:0;-webkit-transform:translateY(-18px);}to{opacity:1;-webkit-transform:translateY(0);}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:translateY(0);}}
.center-wrap{height:calc(100vh - 220px);display:flex;align-items:center;justify-content:center;}
.center-card{background:#fff;padding:50px 60px;border-radius:26px;display:flex;gap:40px;box-shadow:0 8px 28px rgba(0,0,0,0.08);}
.main-btn{width:220px;height:90px;border:none;border-radius:22px;font-size:20px;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--btn-start),var(--btn-end));color:#fff;-webkit-transition:.2s ease;transition:.2s ease;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;}
.main-btn:hover{-webkit-transform:translateY(-3px);transform:translateY(-3px);opacity:.95;}
.main-btn:active{-webkit-transform:scale(0.96);transform:scale(0.96);}
.footer{text-align:center;font-size:12px;color:#999;margin:30px 0;}
</style>
</head>
<body>
<div class="header-box">
  <div class="header-title">Enterprise Project Management</div>
  <div class="header-sub">PR Tracking System</div>
</div>
<div class="center-wrap">
  <div class="center-card">
    <button class="main-btn" onclick="location.href='https://ismailmostafa-lab.github.io/prtracking/trackingsystem.html'">
      Track PR
    </button>
    <button class="main-btn" onclick="location.href='https://ismailmostafa-lab.github.io/prtracking/reports.html'">
      Reports
    </button>
  </div>
</div>
<div class="footer">Enterprise Project Management | Large &amp; Mega Projects Unit</div>
</body>
</html>
